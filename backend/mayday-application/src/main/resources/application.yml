server:
  port: 8080
  error:
    include-message: never
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: mayday-admin
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:13306/mayday?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:mayday}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Shanghai
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
mayday:
  admin-password: ${ADMIN_PASSWORD}
  # 仅首次空库初始化读取；正式新项目默认不创建演示人员、部门与文章。
  seed-demo-data: ${SEED_DEMO_DATA:false}
