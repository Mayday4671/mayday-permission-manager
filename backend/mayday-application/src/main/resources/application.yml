server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      max-file-size: ${MAYDAY_STORAGE_MAX_MB:10}MB
      # 单请求最多一个业务文件；CSV批量导入仍执行自己的行数/正文大小限制。
      max-request-size: 101MB
  application:
    name: mayday-admin
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:13306/mayday?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:mayday}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    # 分离DDL/DML账号时，先用部署迁移任务升级，再关闭业务进程的自动DDL。
    enabled: ${DB_MIGRATIONS_ENABLED:true}
  jackson:
    time-zone: Asia/Shanghai
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        # 本平台核心功能依赖MySQL；数据库故障停止接流量，但不通过存活探针反复重启。
        readiness:
          include: readinessState,db
mayday:
  identity:
    # 默认关闭；启用必须提供独立 32 字节 Base64 加密密钥，并在升级/恢复时保持该密钥。
    mfa-enabled: ${MAYDAY_MFA_ENABLED:false}
    encryption-key: ${MAYDAY_IDENTITY_ENCRYPTION_KEY:}
    issuer-label: ${MAYDAY_IDENTITY_LABEL:Mayday}
    # providers 支持 Spring indexed 配置；可在部署配置文件或环境变量注册多个固定提供方。
    providers: []
  deployment:
    production: ${MAYDAY_PRODUCTION:false}
    public-origin: ${MAYDAY_PUBLIC_ORIGIN:}
  security:
    sessions:
      absolute-minutes: ${MAYDAY_SESSION_ABSOLUTE_MINUTES:720}
      idle-minutes: ${MAYDAY_SESSION_IDLE_MINUTES:30}
      max-per-user: ${MAYDAY_SESSION_MAX_PER_USER:5}
  admin-password: ${ADMIN_PASSWORD}
  # 仅首次空库初始化读取；正式新项目默认不创建演示人员、部门与文章。
  seed-demo-data: ${SEED_DEMO_DATA:false}
  # 项目裁剪只需要调整开关并重启，未启用模块的数据、迁移和旧角色授权仍然保留。
  modules:
    enabled:
      content: ${MODULE_CONTENT_ENABLED:true}
      portal: ${MODULE_PORTAL_ENABLED:true}
      notifications: ${MODULE_NOTIFICATIONS_ENABLED:true}
      approvals: ${MODULE_APPROVALS_ENABLED:true}
      crawler: ${MODULE_CRAWLER_ENABLED:true}
      scheduler: ${MODULE_SCHEDULER_ENABLED:true}
      udp: ${MODULE_UDP_ENABLED:true}
      workorders: ${MODULE_WORKORDERS_ENABLED:false}
      feedback: ${MODULE_FEEDBACK_ENABLED:true}
      # generator:module-environment

# 契约仅允许管理员读取；生产环境可以通过 API_DOCS_ENABLED=false 彻底关闭。
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    path: /api/platform/openapi
  paths-to-match: /api/**
  writer-with-order-by-keys: true
  default-produces-media-type: application/json

# 故障定位只关联随机请求标识，不把请求正文、令牌或查询参数放进关联字段。
logging:
  pattern:
    level: "%5p [requestId:%X{requestId}]"
