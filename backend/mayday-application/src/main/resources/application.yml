server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      max-file-size: ${MAYDAY_STORAGE_MAX_MB:10}MB
      # 单请求最多一个业务文件；CSV批量导入仍执行自己的行数/正文大小限制。
      max-request-size: 101MB
  application:
    name: mayday-admin
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:13306/mayday?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:mayday}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
      # 业务 DATETIME 固定按北京时间保存；每个池连接均设置会话区，SQL NOW() 与应用日历一致。
      # 使用数字偏移不依赖 MySQL 命名时区表；只改变本连接，不修改数据库全局时区。
      connection-init-sql: "SET SESSION time_zone = '+08:00'"
      data-source-properties:
        # driver 时区必须与会话区一致；显式 canonical 属性覆盖旧 DB_URL 中 serverTimezone 别名。
        connectionTimeZone: Asia/Shanghai
        preserveInstants: true
  # MyBatis-Flex 没有持久化上下文；时间绑定由 JDBC 驱动与会话时区直接完成，
  # DATETIME 物理值语义与连接初始化的 +08:00 会话区保持一致。
  mybatis-flex:
    global-config:
      print-banner: false
  flyway:
    # 分离DDL/DML账号时，先用部署迁移任务升级，再关闭业务进程的自动DDL。
    enabled: ${DB_MIGRATIONS_ENABLED:true}
    # 历史 V5 的 TRIM (表达式) 在 MySQL 默认模式下会被当作存储函数；仅为 Flyway 连接启用兼容解析模式。
    init-sqls:
      - "SET SESSION sql_mode = CONCAT_WS(',', NULLIF(@@SESSION.sql_mode, ''), 'IGNORE_SPACE')"
  jackson:
    time-zone: Asia/Shanghai
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        # 本平台核心功能依赖MySQL；数据库故障停止接流量，但不通过存活探针反复重启。
        readiness:
          include: readinessState,db
mayday:
  identity:
    # 默认关闭；启用必须提供独立 32 字节 Base64 加密密钥，并在升级/恢复时保持该密钥。
    mfa-enabled: ${MAYDAY_MFA_ENABLED:false}
    encryption-key: ${MAYDAY_IDENTITY_ENCRYPTION_KEY:}
    issuer-label: ${MAYDAY_IDENTITY_LABEL:Mayday}
    # providers 支持 Spring indexed 配置；可在部署配置文件或环境变量注册多个固定提供方。
    providers: [ ]
  deployment:
    production: ${MAYDAY_PRODUCTION:false}
    public-origin: ${MAYDAY_PUBLIC_ORIGIN:}
  security:
    sessions:
      absolute-minutes: ${MAYDAY_SESSION_ABSOLUTE_MINUTES:720}
      idle-minutes: ${MAYDAY_SESSION_IDLE_MINUTES:30}
      max-per-user: ${MAYDAY_SESSION_MAX_PER_USER:5}
  admin-password: ${ADMIN_PASSWORD}
  # 仅首次空库初始化读取；正式新项目默认不创建演示人员、部门与文章。
  seed-demo-data: ${SEED_DEMO_DATA:false}
  # 项目裁剪只需要调整开关并重启，未启用模块的数据、迁移和旧角色授权仍然保留。
  modules:
    enabled:
      content: ${MODULE_CONTENT_ENABLED:true}
      portal: ${MODULE_PORTAL_ENABLED:true}
      notifications: ${MODULE_NOTIFICATIONS_ENABLED:true}
      approvals: ${MODULE_APPROVALS_ENABLED:true}
      crawler: ${MODULE_CRAWLER_ENABLED:true}
      scheduler: ${MODULE_SCHEDULER_ENABLED:true}
      udp: ${MODULE_UDP_ENABLED:true}
      workorders: ${MODULE_WORKORDERS_ENABLED:false}
      feedback: ${MODULE_FEEDBACK_ENABLED:true}
      agentscope: ${MODULE_AGENTSCOPE_ENABLED:false}
      telegram: ${MODULE_TELEGRAM_ENABLED:false}
      # generator:module-environment
  agentscope:
    api-key: ${DASHSCOPE_API_KEY:}
    model: ${MAYDAY_AGENTSCOPE_MODEL:dashscope:qwen-plus}
    version: ${AGENTSCOPE_VERSION:2.0.4}
    request-timeout-seconds: ${MAYDAY_AGENTSCOPE_TIMEOUT_SECONDS:120}
    max-message-length: ${MAYDAY_AGENTSCOPE_MAX_MESSAGE_LENGTH:4000}
    max-context-messages: ${MAYDAY_AGENTSCOPE_MAX_CONTEXT_MESSAGES:40}
    system-prompt: ${MAYDAY_AGENTSCOPE_SYSTEM_PROMPT:你是 Mayday 工作空间中的通用助手。请以中文清晰、准确地回答问题；你无法访问平台业务数据或执行外部操作，遇到超出上下文的信息时应如实说明。}
  telegram:
    # Telegram 凭据仅从被忽略的本机 .env 或部署环境注入；默认关闭时不会构造客户端或连接网络。
    api-id: ${TELEGRAM_API_ID:}
    api-hash: ${TELEGRAM_API_HASH:}
    session-encryption-key: ${TELEGRAM_SESSION_ENCRYPTION_KEY:}
    data-directory: ${TELEGRAM_DATA_DIR:./data/telegram}
    search-bot-username: ${TELEGRAM_SEARCH_BOT_USERNAME:jisou}
    proxy-enabled: ${TELEGRAM_PROXY_ENABLED:false}
    proxy-type: ${TELEGRAM_PROXY_TYPE:socks5}
    proxy-host: ${TELEGRAM_PROXY_HOST:}
    proxy-port: ${TELEGRAM_PROXY_PORT:0}
    proxy-username: ${TELEGRAM_PROXY_USERNAME:}
    proxy-password: ${TELEGRAM_PROXY_PASSWORD:}
    proxy-secret: ${TELEGRAM_PROXY_SECRET:}
    max-media-file-bytes: ${TELEGRAM_MAX_MEDIA_FILE_BYTES:0}
    max-stored-media-bytes: ${TELEGRAM_MAX_STORED_MEDIA_BYTES:10737418240}
    minimum-free-disk-bytes: ${TELEGRAM_MINIMUM_FREE_DISK_BYTES:1073741824}
    max-media-workers: ${TELEGRAM_MAX_MEDIA_WORKERS:2}
    media-download-timeout-seconds: ${TELEGRAM_MEDIA_DOWNLOAD_TIMEOUT_SECONDS:7200}
    media-retention-days: ${TELEGRAM_MEDIA_RETENTION_DAYS:90}
    seven-zip-path: ${TELEGRAM_7ZIP_PATH:7z}
    ffmpeg-path: ${TELEGRAM_FFMPEG_PATH:ffmpeg}
    ffprobe-path: ${TELEGRAM_FFPROBE_PATH:ffprobe}
    max-preview-output-bytes: ${TELEGRAM_MAX_PREVIEW_OUTPUT_BYTES:1073741824}
    max-preview-duration-seconds: ${TELEGRAM_MAX_PREVIEW_DURATION_SECONDS:7200}
    preview-timeout-seconds: ${TELEGRAM_PREVIEW_TIMEOUT_SECONDS:1800}

# 契约仅允许管理员读取；生产环境可以通过 API_DOCS_ENABLED=false 彻底关闭。
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    path: /api/platform/openapi
  paths-to-match: /api/**
  writer-with-order-by-keys: true
  default-produces-media-type: application/json

# 故障定位只关联随机请求标识，不把请求正文、令牌或查询参数放进关联字段。
logging:
  # TDLib INFO 日志会输出授权请求参数；提高其级别，避免手机号等敏感值进入应用日志。
  level:
    it.tdlight: WARN
  pattern:
    level: "%5p [requestId:%X{requestId}]"
