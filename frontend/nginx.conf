server {
  listen 80;
  # 与服务端最大请求101MB对齐；实际单文件限制仍由后端配置与存储服务校验。
  client_max_body_size 101m;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # 防止第三方站点通过 iframe 覆盖后台操作进行点击劫持；门户当前也不提供嵌入业务。
  # 不添加会破坏 Ant 动态样式的脚本/样式策略；若未来需要嵌入，只对白名单独设计例外。
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header X-Frame-Options DENY always;
  # SSE只传递刷新信号，禁止代理缓冲；断线由前端重连及轮询恢复。
  location = /api/operations/realtime/stream {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 90s;
  }
  location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; }
  # 哈希资源可长期缓存；不存在的脚本必须404，不能把HTML当作模块返回。
  location /assets/ { expires 365d; try_files $uri =404; }
  # 入口文档每次重新验证，防止升级后长期引用已替换的资源文件。
  location / { expires -1; try_files $uri $uri/ /index.html; }
}
