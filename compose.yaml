name: mayday
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先复制 .env.example 为 .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mayday}
      MYSQL_USER: ${MYSQL_USER:-mayday}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请配置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${DB_PORT:-13306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD"']
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-mayday}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: ${MYSQL_USER:-mayday}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请配置 ADMIN_PASSWORD}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${API_PORT:-18080}:8080"
      # UDP 监听由页面手动启动；修改页面端口后需同步此映射。局域网部署可指定宿主机网卡 IP。
      - "${UDP_BIND_ADDRESS:-127.0.0.1}:${UDP_LISTEN_PORT:-19000}:${UDP_LISTEN_PORT:-19000}/udp"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --spider, -q, 'http://127.0.0.1:8080/actuator/health']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-15173}:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  mysql_data:
